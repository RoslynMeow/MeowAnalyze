appId: com.meowanalyze.app
productName: MeowAnalyze
directories:
  output: release
files:
  - dist-electron/**
  - dist-web/**
  - package.json
win:
  target:
    - nsis
  artifactName: meowanalyze-desktop-windows-${version}.${ext}
mac:
  target:
    - dmg
  category: public.app-category.developer-tools
  artifactName: meowanalyze-desktop-macos-${version}.${ext}
linux:
  target:
    - AppImage
    - deb
  category: Development
  maintainer: MeowAnalyze contributors <RoslynMeow@users.noreply.github.com>
  # The package is scoped (@meowanalyze/desktop); electron-builder would derive
  # an invalid executable name from it ("@" and "/" are not allowed in paths).
  executableName: meowanalyze
  artifactName: meowanalyze-desktop-linux-${version}.${ext}
