<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="MeowAnalyze — static code analysis">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1b2430"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc46b"/>
      <stop offset="1" stop-color="#f0883e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffb454" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffb454" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="24" fill="url(#glow)"/>

  <!-- grid -->
  <g stroke="#21262d" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
  </g>

  <!-- wordmark -->
  <text x="252" y="138" font-family="Segoe UI, Arial, sans-serif" font-size="62" font-weight="700" fill="#ffb454">Meow<tspan fill="#e6edf3">Analyze</tspan></text>
  <text x="256" y="178" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#8b949e">Language detection &#183; cyclomatic complexity &#183; nesting depth &#183; LOC</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">
    <text x="830" y="62">complexity</text>
  </g>
  
</svg>
