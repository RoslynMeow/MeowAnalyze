<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="MeowAnalyze — static code analysis">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1b2430"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc46b"/>
      <stop offset="1" stop-color="#f0883e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffb454" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffb454" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="24" fill="url(#glow)"/>

  <!-- grid -->
  <g stroke="#21262d" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
  </g>

  <!-- cat -->
  <g>
    <polygon points="104,116 112,52 158,92" fill="url(#fur)"/>
    <polygon points="196,116 188,52 142,92" fill="url(#fur)"/>
    <polygon points="116,108 121,72 146,94" fill="#5a3216"/>
    <polygon points="184,108 179,72 154,94" fill="#5a3216"/>
    <circle cx="150" cy="158" r="60" fill="url(#fur)"/>
    <circle cx="128" cy="150" r="8" fill="#0d1117"/>
    <circle cx="172" cy="150" r="8" fill="#0d1117"/>
    <circle cx="130" cy="147" r="2.5" fill="#ffffff"/>
    <circle cx="174" cy="147" r="2.5" fill="#ffffff"/>
    <polygon points="150,170 142,180 158,180" fill="#0d1117"/>
    <g stroke="#0d1117" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M150 180 v6"/>
      <path d="M150 186 q-10 10 -20 2"/>
      <path d="M150 186 q10 10 20 2"/>
    </g>
    <g stroke="#ffffff" stroke-width="2" stroke-opacity="0.55" stroke-linecap="round">
      <line x1="88" y1="158" x2="52" y2="150"/>
      <line x1="88" y1="166" x2="50" y2="166"/>
      <line x1="212" y1="158" x2="248" y2="150"/>
      <line x1="212" y1="166" x2="250" y2="166"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="252" y="138" font-family="Segoe UI, Arial, sans-serif" font-size="62" font-weight="700" fill="#ffb454">Meow<tspan fill="#e6edf3">Analyze</tspan></text>
  <text x="256" y="178" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#8b949e">Language detection &#183; cyclomatic complexity &#183; nesting depth &#183; LOC</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">
    <text x="830" y="62">complexity</text>
  </g>

  <!-- chart -->
  <line x1="820" y1="240" x2="1160" y2="240" stroke="#30363d" stroke-width="1"/>
  <g>
    <rect x="830"  y="200" width="34" height="40"  rx="4" fill="#3fb950"/>
    <rect x="878"  y="180" width="34" height="60"  rx="4" fill="#3fb950"/>
    <rect x="926"  y="150" width="34" height="90"  rx="4" fill="#d29922"/>
    <rect x="974"  y="170" width="34" height="70"  rx="4" fill="#d29922"/>
    <rect x="1022" y="110" width="34" height="130" rx="4" fill="#f85149"/>
    <rect x="1070" y="130" width="34" height="110" rx="4" fill="#f85149"/>
    <rect x="1118" y="80"  width="34" height="160" rx="4" fill="#f85149"/>
  </g>
  <polyline points="847,200 895,180 943,150 991,170 1039,110 1087,130 1135,80" fill="none" stroke="#58a6ff" stroke-width="2" stroke-opacity="0.85"/>
  <g fill="#58a6ff">
    <circle cx="847" cy="200" r="3"/>
    <circle cx="943" cy="150" r="3"/>
    <circle cx="1039" cy="110" r="3"/>
    <circle cx="1135" cy="80" r="3"/>
  </g>
</svg>
