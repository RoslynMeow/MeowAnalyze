name: Pages

# Deploy the static web app to GitHub Pages whenever main/master moves.
# The site is a plain static build (no backend): users just open the URL.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; let a newer push supersede a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the static web app
        run: npm run build:web
      # NOTE: enable Pages once in Settings -> Pages -> Source: GitHub Actions.
      # The workflow token cannot create the Pages site for you, so we do not
      # pass `enablement: true` (it fails with "Resource not accessible by
      # integration").
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
